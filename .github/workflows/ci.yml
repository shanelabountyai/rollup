name: ci

on:
  pull_request:
  push:
    branches: [main, kickoff]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: ruff
        run: make lint
      - name: mypy
        run: make typecheck
      - name: pytest (incl. RU-04 reproducibility)
        run: make test
      - name: make build (generate + dbt build, RU-05)
        run: make build
      - name: dbt docs generate
        run: make docs
      - name: defect mutation tests
        run: make test-mutation
