name: ci

on:
  pull_request:
  push:
    branches: [main, kickoff, phase-2, phase-3]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: ruff
        run: make lint
      - name: mypy
        run: make typecheck
      - name: pytest (RU-04, guard + validator + equivalence unit/property tests)
        run: make test
      - name: make build (generate + dbt build, RU-05)
        run: make build
      - name: warehouse tests: runner, hand-written SQL, ask pipeline, eval (RU-01, RU-02, RU-03)
        run: make test-warehouse
      - name: golden-set eval on recorded drafts (no live LLM, D-29)
        run: make eval
      - name: dbt docs generate
        run: make docs
      - name: defect mutation tests
        run: make test-mutation
