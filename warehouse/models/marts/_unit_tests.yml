version: 2

# D-18: DST fixture for the local reporting date computed in fct_pipeline (D-15).

unit_tests:
  - name: opportunity_created_date_is_local_across_dst
    description: >
      fct_pipeline.created_date is the America/New_York day of the UTC created_at around fall back,
      and days_to_close counts local days.
    model: fct_pipeline
    given:
      - input: ref('stg_crm_opportunities')
        rows:
          - {opportunity_id: o1, contact_id: c1, created_at: "2025-11-02 03:30:00", close_date: "2025-11-02", is_closed: true, is_won: false, amount_usd: 1}  # 11-01 23:30 EDT
          - {opportunity_id: o2, contact_id: c1, created_at: "2025-11-02 06:30:00", close_date: "2025-11-02", is_closed: true, is_won: false, amount_usd: 1}  # 11-02 01:30 EST
          - {opportunity_id: o3, contact_id: c1, created_at: "2025-11-03 04:59:59", close_date: "2025-11-03", is_closed: true, is_won: false, amount_usd: 1}  # 11-02 23:59:59 EST
      - input: ref('int_leads_stitched')
        rows:
          - {contact_id: c1, person_key: p1}
      - input: ref('fct_touches')
        rows: []
    expect:
      rows:
        - {opportunity_id: o1, created_date: "2025-11-01", days_to_close: 1}
        - {opportunity_id: o2, created_date: "2025-11-02", days_to_close: 0}
        - {opportunity_id: o3, created_date: "2025-11-02", days_to_close: 1}
