[project]
name = "rollup"
version = "0.1.0"
description = "Marketing warehouse (dbt + DuckDB) with a safe text-to-SQL layer."
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly: RU-04 byte-identical output depends on the RNG stream and Parquet writer (D-14).
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "duckdb>=1.1",
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb>=1.9",
    # Pinned exactly: the guards' safety depends on how sqlglot parses DuckDB SQL (D-22).
    "sqlglot==30.31.0",
    # Query UI (Phase 4, D-03/D-40). HTMX itself is vendored in rollup/ui/static, so the UI works offline.
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "hypothesis>=6.100", "httpx>=0.27"]  # httpx: FastAPI TestClient
# Optional live drafting model (owner hand step, D-36). Never installed or called in CI.
live = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rollup", "rollup.queries", "rollup.eval", "rollup.ui"]

[tool.setuptools.package-data]
"rollup.queries" = ["*.sql"]
"rollup.eval" = ["golden/*.sql", "*.json"]
"rollup.ui" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["warehouse/target", "warehouse/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["rollup", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mutation: slow tests that run dbt with a defect fix switched off",
    "warehouse: tests that need the built DuckDB warehouse (run after `make build` via `make test-warehouse`)",
]
addopts = "-m 'not mutation and not warehouse'"
