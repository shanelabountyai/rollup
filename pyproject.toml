[project]
name = "rollup"
version = "0.1.0"
description = "Marketing warehouse (dbt + DuckDB) with a safe text-to-SQL layer."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.1",
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rollup"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["warehouse/target", "warehouse/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["rollup", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mutation: slow tests that run dbt with a defect fix switched off"]
addopts = "-m 'not mutation'"
