[project]
name = "rollup"
version = "0.1.0"
description = "Marketing warehouse (dbt + DuckDB) with a safe text-to-SQL layer."
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly: RU-04 byte-identical output depends on the RNG stream and Parquet writer (D-14).
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "duckdb>=1.1",
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb>=1.9",
    # Pinned exactly: the guards' safety depends on how sqlglot parses DuckDB SQL (D-22).
    "sqlglot==30.31.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rollup", "rollup.queries"]

[tool.setuptools.package-data]
"rollup.queries" = ["*.sql"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["warehouse/target", "warehouse/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["rollup", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mutation: slow tests that run dbt with a defect fix switched off",
    "warehouse: tests that need the built DuckDB warehouse (run after `make build` via `make test-warehouse`)",
]
addopts = "-m 'not mutation and not warehouse'"
